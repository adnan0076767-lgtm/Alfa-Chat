<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alfa Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e9edef;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: #075e54;
            color: white;
            padding: 18px 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .header-icons {
            font-size: 21px;
        }

        /* SEARCH */
        .search {
            padding: 10px;
            background: #075e54;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            padding: 11px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* CHAT LIST */
        .chat-list {
            background: white;
        }

        .chat {
            display: flex;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat:hover {
            background: #f5f5f5;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #25d366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            margin-right: 13px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chat-message {
            color: #777;
            font-size: 14px;
        }

        .chat-time {
            font-size: 11px;
            color: #999;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }

        .nav-item {
            text-align: center;
            color: #555;
            font-size: 13px;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        /* CHAT SCREEN */
        .chat-screen {
            display: none;
            height: 100vh;
            background: #efeae2;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 12px;
            display: flex;
            align-items: center;
        }

        .back {
            font-size: 25px;
            cursor: pointer;
            margin-right: 12px;
        }

        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .contact-name {
            font-weight: bold;
        }

        .online {
            font-size: 12px;
            opacity: 0.8;
        }

        .messages {
            padding: 20px 12px 80px;
        }

        .message {
            display: inline-block;
            max-width: 75%;
            padding: 9px 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .received {
            background: white;
            float: left;
            clear: both;
        }

        .sent {
            background: #d9fdd3;
            float: right;
            clear: both;
        }

        .message-box {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 8px;
        }

        .message-box input {
            flex: 1;
            border: none;
            outline: none;
            border-radius: 20px;
            padding: 12px 15px;
        }

        .send {
            width: 45px;
            border: none;
            border-radius: 50%;
            background: #25d366;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HALAMAN UTAMA -->
    <div id="homeScreen">

        <div class="header">
            <div class="header-top">
                <h1>Alfa Chat</h1>
                <div class="header-icons">🔍 ⋮</div>
            </div>
        </div>

        <div class="search">
            <input
                type="text"
                placeholder="Cari chat..."
            >
        </div>

        <div class="chat-list">

            <div
                class="chat"
                onclick="openChat('Budi')"
            >
                <div class="avatar">👤</div>

                <div class="chat-info">
                    <div class="chat-name">
                        Budi
                    </div>

                    <div class="chat-message">
                        Halo, apa kabar?
                    </div>
                </div>

                <div class="chat-time">
                    10:30
                </div>
            </div>


            <div
                class="chat"
                onclick="openChat('Andi')"
            >
                <div class="avatar">👤</div>

                <div class="chat-info">
                    <div class="chat-name">
                        Andi
                    </div>

                    <div class="chat-message">
                        Besok jadi?
                    </div>
                </div>

                <div class="chat-time">
                    09:15
                </div>
            </div>


            <div
                class="chat"
                onclick="openChat('Siti')"
            >
                <div class="avatar">👤</div>

                <div class="chat-info">
                    <div class="chat-name">
                        Siti
                    </div>

                    <div class="chat-message">
                        Oke 👍
                    </div>
                </div>

                <div class="chat-time">
                    08:45
                </div>
            </div>

        </div>

        <div class="bottom-nav">

            <div class="nav-item">
                <div class="nav-icon">💬</div>
                Chat
            </div>

            <div class="nav-item">
                <div class="nav-icon">👥</div>
                Kontak
            </div>

            <div class="nav-item">
                <div class="nav-icon">⚙️</div>
                Pengaturan
            </div>

        </div>

    </div>


    <!-- HALAMAN CHAT -->
    <div
        id="chatScreen"
        class="chat-screen"
    >

        <div class="chat-header">

            <div
                class="back"
                onclick="closeChat()"
            >
                ←
            </div>

            <div class="chat-avatar">
                👤
            </div>

            <div>
                <div
                    id="contactName"
                    class="contact-name"
                >
                    Budi
                </div>

                <div class="online">
                    online
                </div>
            </div>

        </div>


        <div class="messages">

            <div class="message received">
                Halo! 👋
            </div>

            <div class="message sent">
                Hai Budi!
            </div>

            <div class="message received">
                Lagi apa?
            </div>

        </div>


        <div class="message-box">

            <input
                type="text"
                placeholder="Ketik pesan..."
                id="messageInput"
            >

            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>

    function openChat(name) {

        document.getElementById(
            "homeScreen"
        ).style.display = "none";

        document.getElementById(
            "chatScreen"
        ).style.display = "block";

        document.getElementById(
            "contactName"
        ).textContent = name;
    }


    function closeChat() {

        document.getElementById(
            "chatScreen"
        ).style.display = "none";

        document.getElementById(
            "homeScreen"
        ).style.display = "block";
    }


    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );

        const message =
            input.value.trim();

        if (message === "") {
            return;
        }

        const messageElement =
            document.createElement("div");

        messageElement.className =
            "message sent";

        messageElement.textContent =
            message;

        document
            .querySelector(".messages")
            .appendChild(messageElement);

        input.value = "";

    }

</script>

</body>
</html>
